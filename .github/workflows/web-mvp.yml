name: Sports Edge AI - web MVP checks
on:
  push:
    branches: [feature/web-mvp-2026-11-12, webdemo, feature/live-sources-nov12, feature/automatic-day-market-odds]
  pull_request:
    branches: [main, webdemo]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compilar codigo de interfaz y simulacion
        run: python -m compileall -q app.py src/
      - name: Probar todo el proyecto
        run: python -m unittest discover -s tests -v
