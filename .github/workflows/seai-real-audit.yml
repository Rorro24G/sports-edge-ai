name: Sports Edge AI - ESPN historical model audit
on:
  workflow_dispatch:
  pull_request:
    branches: [webdemo]
    paths:
      - src/independent_picks.py
      - src/pick_judgement.py
      - src/pick_walkforward.py
      - src/model_calibration.py
      - scripts/backtest_seai.py
      - scripts/calibrate_seai.py
      - .github/workflows/seai-real-audit.yml
  push:
    branches: [webdemo]
    paths:
      - src/independent_picks.py
      - src/pick_judgement.py
      - src/pick_walkforward.py
      - src/model_calibration.py
      - scripts/backtest_seai.py
      - scripts/calibrate_seai.py
      - .github/workflows/seai-real-audit.yml
permissions:
  contents: read
jobs:
  audit-real-nba:
    # ESPN endpoints are not guaranteed to be available.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Auditar NBA 2025 sin resultados futuros ni picks Covers
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m scripts.backtest_seai \
            --sport NBA --start 2025-11-10 --end 2025-12-02 \
            --max-games 160 --output audit-output/seai-nba-2025.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("audit-output/seai-nba-2025.json").read_text())
          print("ESPN_REAL_AUDIT", "fetched", report["retrieved_fixture_count"],
                "evaluated", report["evaluated_count"],
                "candidates", report["candidate_count"],
                "wins", report["correct_candidates"],
                "accuracy", report["candidate_accuracy_observed"],
                "interval", report["candidate_accuracy_wilson_95"],
                "brier", report["brier_all_evaluated"],
                "data_complete", report["data_complete"], flush=True)
          if not report["data_complete"]:
              raise SystemExit("Proveedor ESPN incompleto: no presentar cobertura total")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seai-real-espn-audit
          path: audit-output/
          retention-days: 14
          if-no-files-found: warn

  audit-real-nfl:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Medir NFL 2025 con histórico ESPN cronológico
        run: |
          PYTHONPATH=. python -m scripts.backtest_seai \
            --sport NFL --start 2025-10-13 --end 2025-11-19 \
            --max-games 100 --output audit-output/seai-nfl-2025.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seai-real-nfl-audit
          path: audit-output/
          retention-days: 14
          if-no-files-found: warn

  audit-real-nhl:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Medir NHL 2025 con histórico ESPN cronológico
        run: |
          PYTHONPATH=. python -m scripts.backtest_seai \
            --sport NHL --start 2025-11-02 --end 2025-11-25 \
            --max-games 160 --output audit-output/seai-nhl-2025.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seai-real-nhl-audit
          path: audit-output/
          retention-days: 14
          if-no-files-found: warn

  audit-2026-nba:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Auditoría separada NBA temporada actual 2026
        run: |
          PYTHONPATH=. python -m scripts.backtest_seai \
            --sport NBA --start 2026-10-28 --end 2026-11-17 \
            --max-games 160 --output audit-output/seai-nba-2026.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seai-real-nba-2026
          path: audit-output/
          retention-days: 14
          if-no-files-found: warn

  audit-2026-nfl:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Auditoría separada NFL temporada actual 2026
        run: |
          PYTHONPATH=. python -m scripts.backtest_seai \
            --sport NFL --start 2026-09-28 --end 2026-11-17 \
            --max-games 110 --output audit-output/seai-nfl-2026.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seai-real-nfl-2026
          path: audit-output/
          retention-days: 14
          if-no-files-found: warn

  audit-2026-nhl:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Auditoría separada NHL temporada actual 2026
        run: |
          PYTHONPATH=. python -m scripts.backtest_seai \
            --sport NHL --start 2026-10-25 --end 2026-11-17 \
            --max-games 160 --output audit-output/seai-nhl-2026.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seai-real-nhl-2026
          path: audit-output/
          retention-days: 14
          if-no-files-found: warn

  calibration-experiment-nba:
    needs: [audit-real-nba, audit-2026-nba]
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: seai-real-espn-audit
          path: audit-data/train
      - uses: actions/download-artifact@v4
        with:
          name: seai-real-nba-2026
          path: audit-data/holdout
      - name: Ajustar en NBA 2025 y evaluar NBA 2026 sin reentrenamiento futuro
        run: |
          PYTHONPATH=. python -m scripts.calibrate_seai \
            --train audit-data/train/seai-nba-2025.json \
            --holdout audit-data/holdout/seai-nba-2026.json \
            --output audit-output/seai-nba-temporal-calibration.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seai-nba-temporal-calibration
          path: audit-output/
          retention-days: 14
          if-no-files-found: warn
