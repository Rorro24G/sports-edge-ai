name: Picks - Streamlit UI smoke
on:
  push:
    branches: [feature/picks-ui-smoke-verified-matching-nov13]
  pull_request:
    branches: [webdemo]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  picks-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Streamlit
        run: pip install -r requirements-web.txt
      - name: Tests del motor sin red
        run: python -m unittest discover -s tests -v
      - name: Comprobar interfaz de Picks
        run: PYTHONPATH=. python scripts/smoke_picks_ui.py
      - name: Comprobar borradores Parlays de Covers y discusión
        run: PYTHONPATH=. python scripts/smoke_parlay_ui.py
      - name: Comprobar entrada de apuesta y bank en Streamlit
        run: PYTHONPATH=. python scripts/smoke_ledger_ui.py
