name: Sports Edge AI - informe diario 6 AM Mexico

on:
  push:
    branches: [main]
  schedule:
    # Ciudad de Mexico (UTC-6 durante todo el ano): 06:00 hora local.
    # Los cron de GitHub Actions pueden retrasarse; no garantizan minuto exacto.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-edge-picks-daily
  cancel-in-progress: false

jobs:
  build-daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Leer la aplicacion activa en webdemo
        uses: actions/checkout@v4
        with:
          ref: webdemo
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generar informe diario sin publicar datos de terceros
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m src.daily_picks --output-dir daily-output
      - name: Guardar informe privado en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: informe-picks-del-dia
          path: daily-output/
          retention-days: 7
          if-no-files-found: error

      - name: Publicar informe del dia en la rama que ejecuta Streamlit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/web-mvp-2026-11-12
          git checkout -B morning-data origin/feature/web-mvp-2026-11-12
          mkdir -p data
          cp daily-output/picks.json data/picks_diario.json
          # No publicar jamás un informe de otra fecha por equivocación.
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          with open("data/picks_diario.json", encoding="utf-8") as f:
              payload = json.load(f)
          today = datetime.now(ZoneInfo("America/Mexico_City")).date().isoformat()
          if payload.get("date_cdmx") != today:
              raise SystemExit("Informe de fecha equivocada; cancelada la publicación")
          if payload.get("pick_status") != "SIN_MODELO_VALIDADO":
              raise SystemExit("No publicar un estado de picks no verificado")
          print("Informe validado para", today, flush=True)
          PY
          git add data/picks_diario.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el informe"
          else
            git commit -m "Actualizar radar de Picks en CDMX"
            git push origin HEAD:feature/web-mvp-2026-11-12
          fi
