<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050d0a">
<title>EDGE SPORTS AI | Cerebro interactivo</title>
<style>
:root{--neon:#77ffa3;--dark:#050d0a;--line:#214e35}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--dark);font-family:Arial,Helvetica,sans-serif;color:#eefff3}
body{background:radial-gradient(ellipse at 50% 45%,#103023 0%,#07150f 41%,#040a08 82%)}
button{cursor:pointer;font:inherit}
main{position:relative;width:100vw;height:100dvh;overflow:hidden}
main:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0px,transparent 74px,#72fa9b06 75px),repeating-linear-gradient(90deg,transparent 0px,transparent 74px,#72fa9b06 75px);mask-image:radial-gradient(ellipse at center,#000,transparent 80%);pointer-events:none}
section{position:absolute;inset:0;opacity:0;pointer-events:none;visibility:hidden;transform:scale(.88);transition:opacity .65s ease,transform .9s cubic-bezier(.16,.75,.18,1),visibility 0s linear .65s}
section.active{opacity:1;pointer-events:auto;visibility:visible;transform:scale(1);transition:opacity .7s ease,transform .9s cubic-bezier(.16,.75,.18,1),visibility 0s}
#intro{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:32px;text-align:center}
#intro h1{font-size:clamp(1.7rem,6.8vw,6.6rem);letter-spacing:.25em;text-indent:.25em;color:var(--neon);font-weight:700;line-height:1.06;margin:0;text-shadow:0 0 34px #5eff8955}
.entry{width:82px;height:82px;border-radius:50%;border:1px solid #72ffa48a;background:radial-gradient(circle,#85ffc1 0%,#3aab66 8%,#103d26 30%,#07180f 70%);position:relative;box-shadow:0 0 58px #50ff864a;outline-offset:10px}
.entry:before,.entry:after{content:"";position:absolute;inset:-15px;border:1px solid #65f99058;border-radius:50%;animation:pulse 2.8s ease-out infinite}
.entry:after{animation-delay:1.4s}
@keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.5);opacity:0}}
.hint{font-size:.7rem;color:#70a98a;letter-spacing:.24em;text-transform:uppercase;margin:0}
#intro.zoom{transform:scale(3);opacity:0}
#brain{position:absolute}
header{position:absolute;z-index:5;left:4vw;right:4vw;top:25px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:.82rem;letter-spacing:.22em;color:var(--neon);font-weight:700}
.ghost{background:#081b11dd;border:1px solid var(--line);color:#baffce;padding:10px 17px;border-radius:18px;font-size:.75rem}
.ghost:hover,.ghost:focus-visible{border-color:var(--neon);outline-color:var(--neon)}
#stage{position:absolute;inset:10% 0 11%;touch-action:none;cursor:grab;outline:none}
#stage:active{cursor:grabbing}
canvas,#hotspots{position:absolute;inset:0;width:100%;height:100%}
#hotspots{pointer-events:none}
.neuron{position:absolute;transform:translate(-50%,-50%);background:#06150de8;color:#e4ffec;white-space:nowrap;border:1px solid #72ff9b8f;border-radius:50px;padding:10px 13px 10px 9px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:.78rem;letter-spacing:.08em;pointer-events:auto;box-shadow:0 0 26px #5bff821f}
.neuron:hover,.neuron:focus-visible{outline:none;border-color:var(--neon);box-shadow:0 0 38px #67ff9055}
.neuron .light{display:block;width:12px;height:12px;border-radius:50%;background:var(--neon);box-shadow:0 0 0 5px #70ff9c20,0 0 17px var(--neon);animation:light 2.1s ease-in-out infinite}
@keyframes light{50%{box-shadow:0 0 0 11px #70ff9c05,0 0 26px var(--neon)}}
.instruction{position:absolute;bottom:4vh;text-align:center;width:100%;font-size:.72rem;letter-spacing:.12em;color:#71a88a}
#detail{display:grid;place-items:center;padding:20px}
.panel{position:relative;max-width:660px;width:94%;border:1px solid #366447;background:linear-gradient(120deg,#0c2116ef,#06140cea);border-radius:24px;padding:clamp(24px,5vw,56px);box-shadow:0 0 90px #0c7f3d29}
.panel .overline{color:var(--neon);font-size:.73rem;letter-spacing:.22em;font-weight:700}
.panel h2{font-size:clamp(2.1rem,5vw,4rem);letter-spacing:-.03em;line-height:1.1;margin:24px 0}
.panel p{font-size:1.01rem;line-height:1.72;color:#afd4bf}
.panel .badge{display:inline-block;border:1px solid #80633c;color:#ffd99b;border-radius:18px;padding:8px 12px;font-size:.73rem;letter-spacing:.08em}
.back{padding:12px 18px;border-radius:12px;border:1px solid #3d7650;background:#10271a;color:var(--neon);margin-top:26px}
@media(max-width:640px){#intro h1{letter-spacing:.1em;text-indent:.1em}.neuron{font-size:.62rem;padding:7px 9px 7px 7px;gap:7px}.neuron .light{width:9px;height:9px}.instruction{font-size:.58rem;bottom:3vh}#stage{inset:15% 0 10%}header{top:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<section id="intro" class="active" aria-label="Portada minimalista">
<h1>EDGE<br>SPORTS AI</h1>
<button id="enter" class="entry" type="button" aria-label="Entrar al cerebro"></button>
<p class="hint">Toca el punto para entrar</p>
</section>
<section id="brain" aria-hidden="true" aria-label="Cerebro interactivo">
<header><span class="brand">EDGE SPORTS AI</span><button class="ghost" type="button" id="exit">← SALIR</button></header>
<div id="stage" tabindex="0" role="group" aria-label="Arrastra para girar el cerebro. También puedes usar las flechas del teclado.">
<canvas id="view" aria-hidden="true"></canvas>
<div id="hotspots">
<button class="neuron" data-page="picks" type="button"><span class="light"></span>PICKS</button>
<button class="neuron" data-page="simulaciones" type="button"><span class="light"></span>SIMULACIONES</button>
<button class="neuron" data-page="calendario" type="button"><span class="light"></span>CALENDARIO</button>
<button class="neuron" data-page="apuestas" type="button"><span class="light"></span>APUESTAS DEL DÍA</button>
</div>
</div>
<p class="instruction">ARRASTRA PARA GIRAR · TOCA UNA NEURONA</p>
</section>
<section id="detail" aria-hidden="true">
<header><span class="brand">EDGE SPORTS AI</span><button class="ghost" type="button" id="home">⌂ INICIO</button></header>
<article class="panel">
<div class="overline">DENTRO DEL CEREBRO / ◉</div>
<h2 id="title"></h2>
<span id="status" class="badge"></span>
<p id="copy"></p>
<button id="return" class="back" type="button">← VOLVER AL CEREBRO</button>
</article>
</section>
</main>
<script>
(function () {
'use strict';
var pages = {
picks:['PICKS','FALTAN CUOTAS Y MODELO VALIDADO','Aquí verás los picks por deporte, las cuotas, probabilidades comprobadas, valor esperado, fuentes y riesgos. Hasta contar con datos actualizados y modelos calibrados, no se mostrarán selecciones inventadas.'],
simulaciones:['SIMULACIONES','LABORATORIO DE 10,000 ESCENARIOS','Aquí podrás seleccionar un partido y ejecutar simulaciones basadas en sus estadísticas. El motor matemático de Python está preparado como laboratorio, pero falta conectarlo a datos reales y validarlo.'],
calendario:['CALENDARIO','FALTA CONECTOR DE CALENDARIO VIVO','Aquí aparecerá el calendario mensual de NBA, NFL, NHL y ATP/WTA. Los datos de la primera versión son una copia limitada; se conectarán fuentes actualizadas antes de utilizarla para decisiones.'],
apuestas:['APUESTAS DEL DÍA','FALTAN MOMIOS Y DATOS VERIFICADOS','Aquí se agruparán oportunidades del día, posibles combinaciones, movimientos de cuota y porcentajes de boletos/dinero cuando haya fuentes confiables. No es una recomendación de apuesta todavía.']
};
function byId(id){return document.getElementById(id);}
function show(name){
['intro','brain','detail'].forEach(function(id){
var e=byId(id),active=id===name;e.classList.toggle('active',active);e.setAttribute('aria-hidden',active?'false':'true');e.inert=!active;
});
if(name==='brain')requestAnimationFrame(resize);
}
byId('enter').addEventListener('click',function(){
byId('intro').classList.add('zoom');
setTimeout(function(){byId('intro').classList.remove('zoom');show('brain');},440);
});
byId('exit').addEventListener('click',function(){show('intro');});
byId('home').addEventListener('click',function(){show('intro');});
byId('return').addEventListener('click',function(){show('brain');});
var nodeEls=Array.prototype.slice.call(document.querySelectorAll('.neuron'));
nodeEls.forEach(function(e){e.addEventListener('click',function(){
var data=pages[e.getAttribute('data-page')];if(!data)return;
byId('title').textContent=data[0];byId('status').textContent=data[1];byId('copy').textContent=data[2];show('detail');
});});
var canvas=byId('view'),ctx=canvas.getContext('2d'),stage=byId('stage');
var yaw=-.1,pitch=-.09,w=1000,h=700,dragging=false,lastX=0,lastY=0,frame=0;
var anchors=[[-1.07,.52,.84],[1.08,.54,.84],[-1.07,-.61,.82],[1.08,-.58,.83]];
function turn(p){
var cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
var x=p[0]*cy+p[2]*sy,z=-p[0]*sy+p[2]*cy;
return [x,p[1]*cp-z*sp,p[1]*sp+z*cp];
}
function project(p){
var r=turn(p),unit=Math.min(w/4.5,h/2.7),lens=4.6/(4.6-r[2]);
return [w*.5+r[0]*unit*lens,h*.5-r[1]*unit*lens,r[2]];
}
function surface(side,polar,azi,wobble){
var s=Math.sin(polar),factor=1+wobble*(Math.sin(10*azi+3*polar+side)+.4*Math.sin(17*azi-5*polar));
return [side*.53+s*Math.cos(azi)*.82*factor,Math.cos(polar)*.94,s*Math.sin(azi)*.75*factor];
}
var paths=[];
[-1,1].forEach(function(side){
for(var r=1;r<20;r++){
var lat=.1+r*Math.PI/20,one=[];
for(var i=0;i<=100;i++)one.push(surface(side,lat,i*Math.PI*2/100,.043));
paths.push(one);
}
for(var j=0;j<28;j++){
var mer=j*Math.PI*2/28,two=[];
for(var k=1;k<51;k++)two.push(surface(side,k*Math.PI/52,mer+.035*Math.sin(k*.72+j),.063));
paths.push(two);
}
});
function draw(){
if(!ctx)return;ctx.clearRect(0,0,w,h);
var ordered=paths.map(function(p){return {pts:p,depth:turn(p[Math.floor(p.length/2)])[2]};}).sort(function(a,b){return a.depth-b.depth;});
ctx.lineWidth=1;
ordered.forEach(function(path){
var depth=path.depth,shade=Math.max(.1,Math.min(1,(depth+1.8)/3));
ctx.strokeStyle=depth>.1?'rgba(104,255,147,'+(.12+.3*shade)+')':'rgba(35,129,76,'+(.07+.12*shade)+')';
ctx.beginPath();path.pts.forEach(function(pt,i){var pos=project(pt);if(i===0)ctx.moveTo(pos[0],pos[1]);else ctx.lineTo(pos[0],pos[1]);});ctx.stroke();
});
nodeEls.forEach(function(node,index){
var p=project(anchors[index]);node.style.left=p[0]+'px';node.style.top=p[1]+'px';
var visible=p[2]>-.45;node.style.opacity=visible?'1':'.13';
node.style.pointerEvents=visible?'auto':'none';node.tabIndex=visible?0:-1;
});
}
function redraw(){if(frame)return;frame=requestAnimationFrame(function(){frame=0;draw();});}
function resize(){
var box=stage.getBoundingClientRect();if(box.width<8)return;
w=box.width;h=box.height;var d=Math.min(window.devicePixelRatio||1,2);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);draw();
}
stage.addEventListener('pointerdown',function(e){if(e.target.closest('.neuron'))return;dragging=true;lastX=e.clientX;lastY=e.clientY;stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',function(e){if(!dragging)return;yaw+=(e.clientX-lastX)*.009;pitch=Math.max(-1,Math.min(1,pitch+(e.clientY-lastY)*.007));lastX=e.clientX;lastY=e.clientY;redraw();});
stage.addEventListener('pointerup',function(){dragging=false;});
stage.addEventListener('pointercancel',function(){dragging=false;});
stage.addEventListener('keydown',function(e){
if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(e.key)<0)return;e.preventDefault();
if(e.key==='ArrowLeft')yaw-=.2;if(e.key==='ArrowRight')yaw+=.2;
if(e.key==='ArrowUp')pitch=Math.max(-1,pitch-.2);if(e.key==='ArrowDown')pitch=Math.min(1,pitch+.2);
redraw();
});
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
resize();
})();
</script>
</body></html>
