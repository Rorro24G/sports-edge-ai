<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{color-scheme:dark;--red:#ff5365;--light:#ff8893;--black:#050506}*{box-sizing:border-box}html,body{margin:0;background:var(--black);color:#f6f3f4;font-family:Arial,Helvetica,sans-serif;overflow:hidden}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid white;outline-offset:8px}#stage{height:760px;min-height:560px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#22090e55,transparent 61%)}#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .65s,transform .9s;text-align:center;padding:24px;background:#050506;z-index:5}.eyebrow{font-size:10px;letter-spacing:.38em;color:#bd8289;font-weight:700}.brand{font-size:clamp(48px,8.7vw,108px);letter-spacing:-.07em;line-height:.91;color:var(--red);margin:29px 0 22px;font-weight:900;text-shadow:0 0 46px #ff445333}.brand span{display:block;font-size:.55em;letter-spacing:.29em;margin:18px 0 0 .29em;color:var(--light)}.sub{font-size:13px;color:#bdaeb1;line-height:1.8;letter-spacing:.06em;margin:5px 0 35px}#enter{position:relative;color:#160306;background:var(--red);border:1px solid #ff9aa4;border-radius:50%;width:94px;height:94px;font-size:24px;box-shadow:0 0 32px #ff536557;animation:pulse 2.8s ease-in-out infinite}#enter:before,#enter:after{content:'';position:absolute;inset:-10px;border-radius:50%;border:1px solid #ff536548}#enter:after{inset:-22px;border-color:#ff53651b}.enter-label{margin-top:34px;font-size:10px;letter-spacing:.35em;color:var(--light)}.corner{position:absolute;bottom:25px;font-size:9px;letter-spacing:.18em;color:#8c7378}.corner.left{left:28px}.corner.right{right:28px}.hidden{opacity:0!important;pointer-events:none!important}#intro.leaving{transform:scale(1.22);opacity:0;pointer-events:none}#brain-ui{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s}header{position:absolute;top:30px;left:30px;right:30px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:12px;font-weight:800;letter-spacing:.15em;color:var(--red)}.mode{font-size:9px;letter-spacing:.2em;color:#9c737b}#nodes{position:absolute;inset:0}.neuron{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;color:var(--red);width:128px;height:70px;padding:0;transform:translate(-50%,-50%);will-change:transform;transition:opacity .2s}.neuron .label{position:absolute;bottom:49px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.14em;white-space:nowrap;font-weight:800;text-shadow:0 2px 8px #000,0 0 12px #ff536540;background:#070506c9;padding:5px 8px;border-radius:3px}.neuron .dot{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#ff7b87;box-shadow:0 0 0 6px #ff536516,0 0 18px #ff5365,0 0 40px #ff536562}.neuron .dot:after{content:'';position:absolute;inset:-11px;border:1px solid #ff65766e;border-radius:50%}.neuron:hover .dot,.neuron:focus-visible .dot{background:#fff;box-shadow:0 0 30px #ff5365}.neuron:hover .label{color:#fff}.controls{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);pointer-events:auto;display:flex;gap:14px}.controls button{border:1px solid #633039;color:#ff8290;background:#10090c;border-radius:20px;font-size:10px;letter-spacing:.08em;padding:9px 16px}.hint{position:absolute;bottom:34px;width:100%;text-align:center;font-size:10px;color:#a8868d;letter-spacing:.14em}#flight-label{position:absolute;top:45%;width:100%;text-align:center;letter-spacing:.3em;color:var(--light);font-size:11px;opacity:0;pointer-events:none}#fallback{display:none;position:absolute;bottom:0}.reduced #enter{animation:none}@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 24px #ff536544}50%{transform:scale(1.06);box-shadow:0 0 48px #ff536588}}@media(max-width:600px){#stage{height:680px}.brand{font-size:62px}.corner{font-size:8px}.mode{display:none}.neuron{width:100px}.neuron .label{font-size:9px;letter-spacing:.07em;padding:4px}.hint{font-size:8px;letter-spacing:.06em}header{left:20px;top:20px}.sub{font-size:12px}}

/* Always-on neon: bright, animated, and clearly visible even without hovering. */
#stage{background:radial-gradient(ellipse at 50% 52%,#39071288 0%,#13040a 43%,#050506 83%)}
/* Let the moving brain be visible THROUGH the intro instead of hiding it behind opaque paint. */
#intro{background:radial-gradient(ellipse at 50% 50%,rgba(5,5,6,.24) 0%,rgba(5,5,6,.13) 48%,rgba(5,5,6,.58) 100%);isolation:isolate}

#stage .neuron .dot{width:19px;height:19px;margin:-9.5px}

#stage .neuron:nth-child(2n) .label{animation-delay:-.8s}

@media(max-width:600px){#stage .neuron .label{font-size:10px}#stage .brand{font-size:clamp(46px,13vw,62px)}}

.reduced #stage .brand,.reduced #stage .brand span,.reduced #stage .logo,
.reduced #stage .eyebrow,.reduced #stage .enter-label,.reduced #stage #enter,
.reduced #stage #enter:before,.reduced #stage #enter:after,.reduced #stage .neuron,
.reduced #stage .neuron .dot,.reduced #stage .neuron .dot:before,
.reduced #stage .neuron .dot:after,.reduced #stage .neuron .label,

#stage .neuron,#stage .neuron .label{animation:none;transform:translate(-50%,-50%)}

<body><main id="stage">
<canvas id="scene" aria-label="Cerebro tridimensional de líneas rojas. Usa los seis botones para abrir una sección."></canvas>
<section id="intro"><div class="eyebrow">INTELIGENCIA DEPORTIVA</div><h1 class="brand">SPORTS EDGE<span>AI</span></h1><p class="sub">Cada decisión comienza con una conexión.</p><button id="enter" aria-label="Entrar al cerebro">↗</button><div class="enter-label">ENTRAR AL CEREBRO</div><span class="corner left">SEIS CONEXIONES. UN CEREBRO.</span><span class="corner right">SPORTS EDGE AI / 01</span></section>
<section id="brain-ui" aria-label="Navegación del cerebro" inert><header><span class="logo">SPORTS EDGE AI</span><span class="mode">EL CEREBRO / ELIGE UNA CONEXIÓN</span></header><div id="nodes">
<button class="neuron" data-page="picks"><span class="label">PICKS</span><span class="dot"></span></button>
<button class="neuron" data-page="parlays"><span class="label">PARLAYS</span><span class="dot"></span></button>
<button class="neuron" data-page="noticias"><span class="label">NOTICIAS</span><span class="dot"></span></button>
<button class="neuron" data-page="simulaciones"><span class="label">SIMULACIONES</span><span class="dot"></span></button>
<button class="neuron" data-page="historial"><span class="label">HISTORIAL</span><span class="dot"></span></button>
<button class="neuron" data-page="calendario"><span class="label">CALENDARIO</span><span class="dot"></span></button>
</div><div class="controls"><button id="rotate" aria-pressed="false">Pausar giro</button><button id="reset">Centrar cerebro</button></div><div class="hint">ARRASTRA PARA EXPLORAR · ELIGE UN PUNTO PARA ENTRAR</div></section><button id="motion-toggle" aria-pressed="true" aria-label="Activar o pausar las animaciones">MOVIMIENTO ON</button><div id="flight-label" role="status" aria-live="polite"></div>
</main>
<script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
const intro=document.getElementById('intro'),ui=document.getElementById('brain-ui'),flight=document.getElementById('flight-label');
const prefersReduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let reduced=prefersReduced;
function syncMotion(){
  document.body.classList.toggle('reduced',reduced);
  const toggle=document.getElementById('motion-toggle');
  toggle.textContent=reduced?'ACTIVAR MOVIMIENTO':'MOVIMIENTO ON';
  toggle.setAttribute('aria-pressed',String(!reduced));
}
syncMotion();
document.getElementById('motion-toggle').onclick=()=>{
  reduced=!reduced;
  paused=reduced;
  syncMotion();updatePause();
};
let W=1000,H=760,state='intro',angle=-.18,tilt=.12,paused=reduced,drag=false,lastX=0,lastY=0,start=0,zoom=1,breathing=1,flightBlend=0,flightX=0,flightY=0,target=null,ready=false,hovering=false,renderTime=0;
const nodes=[...document.querySelectorAll('.neuron')];
const anchors=[[-.64,-.65,.60],[.64,-.64,.60],[-.88,.05,.18],[.88,.06,.18],[-.50,.74,.48],[.50,.74,.48]];
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function size(){W=stage.clientWidth;H=stage.clientHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);send('streamlit:setFrameHeight',{height:H})}addEventListener('resize',size);
function showBrain(){state='brain';intro.classList.add('hidden');intro.inert=true;ui.style.opacity=1;ui.inert=false;nodes[0].focus({preventScroll:true})}
document.getElementById('enter').onclick=()=>{intro.classList.add('leaving');intro.inert=true;if(reduced){showBrain();return}state='entry';start=performance.now();flight.textContent='';flight.style.opacity=0};
function openSection(button){
  if(state!=='brain')return;
  const index=nodes.indexOf(button),focus=nodePoint(index);
  flightX=focus[0]-W/2;flightY=focus[1]-H*.48;flightBlend=0;
  target=button.dataset.page;state='dive';start=performance.now();
  ui.style.opacity=0;ui.inert=true;
  flight.textContent=button.innerText;flight.style.opacity=1;
  if(reduced)finish();
}
function finish(){state='done';send('streamlit:setComponentValue',{value:{page:target,nonce:Date.now()},dataType:'json'});flight.textContent=target.toUpperCase();if(window.parent===window){setTimeout(()=>{zoom=1;flightBlend=0;showBrain();flight.style.opacity=0},900)}}
nodes.forEach(b=>{
 b.onclick=()=>openSection(b);
 b.onpointerenter=()=>{hovering=true};
 b.onpointerleave=()=>{hovering=false};
});
function updatePause(){document.getElementById('rotate').textContent=paused?'Reanudar giro':'Pausar giro';document.getElementById('rotate').setAttribute('aria-pressed',String(paused))}updatePause();
document.getElementById('rotate').onclick=()=>{paused=!paused;updatePause()};document.getElementById('reset').onclick=()=>{angle=-.18;tilt=.12};
canvas.onpointerdown=e=>{if(state!=='brain')return;drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;angle+=(e.clientX-lastX)*.005;tilt=Math.max(-.5,Math.min(.5,tilt+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY};canvas.onpointerup=canvas.onpointercancel=()=>drag=false;
addEventListener('keydown',e=>{if(state!=='brain')return;if(e.key==='ArrowLeft'){angle-=.09;e.preventDefault()}if(e.key==='ArrowRight'){angle+=.09;e.preventDefault()}});
function project(p){let[x,y,z]=p;let a=x*Math.cos(angle)+z*Math.sin(angle),b=-x*Math.sin(angle)+z*Math.cos(angle);let c=y*Math.cos(tilt)-b*Math.sin(tilt),d=y*Math.sin(tilt)+b*Math.cos(tilt);let scale=Math.min(W*.255,H*.32)*zoom*breathing,depth=4.8/(4.8-d);return[W/2+a*scale*depth-flightX*flightBlend*zoom,H*.48+c*scale*depth-flightY*flightBlend*zoom,d]}
// Two folded hemispheres share one rotating 3D coordinate system with the nodes.
function brainPoint(side,lat,lon){const ring=Math.sin(lat),fold=1+.035*Math.sin(lon*9+lat*5)*Math.sin(lat*7);return[side*(.12+.76*ring*(1+Math.cos(lon))*.5)*fold,-1.04*Math.cos(lat)*fold,.82*ring*Math.sin(lon)*fold]}
const paths=[];for(const side of [-1,1]){for(let j=1;j<19;j++){let line=[];for(let k=0;k<=96;k++)line.push(brainPoint(side,j*Math.PI/19,k*Math.PI*2/96));paths.push(line)}for(let k=0;k<24;k++){let line=[];for(let j=0;j<=60;j++)line.push(brainPoint(side,j*Math.PI/60,k*Math.PI*2/24));paths.push(line)}}
// Cerebellum and stem keep the wire silhouette recognizably brain-shaped.
for(let j=0;j<7;j++){let line=[];for(let k=0;k<=60;k++){const t=k*Math.PI*2/60;line.push([Math.cos(t)*(.36-j*.024),.87+j*.035,Math.sin(t)*.39-.28])}paths.push(line)}
for(let k=0;k<6;k++)paths.push([[.10*Math.cos(k),.98,-.15],[.09*Math.cos(k),1.17,-.20],[.065*Math.cos(k),1.31,-.16]]);
function thinkingPoint(p,t){
 if(reduced)return p;
 const phase=t*.0017+p[0]*2.6+p[1]*3.2+p[2]*2;
 return [p[0]+.035*Math.sin(phase),p[1]+.025*Math.cos(phase*.87),p[2]+.028*Math.sin(phase*.72)];
}
function nodePoint(i){return project(thinkingPoint(anchors[i],renderTime))}
function drawNodePulse(point,index,t){
 const phase=reduced?0:((t/2200+index*.19)%1);
 const radius=12+phase*26;
 ctx.strokeStyle='rgba(255,94,120,'+(reduced?.35:.7*(1-phase))+')';
 ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(point[0],point[1],radius,0,Math.PI*2);ctx.stroke();
}
function drawBrain(t=0){
 renderTime=reduced?0:t;
  breathing=reduced?1:1+.033*Math.sin(t*.0018);
  for(let i=0;i<paths.length;i++){
    const pp=paths[i].map((p,j)=>project(reduced?p:thinkingPoint(p,t,i,j)));
    const z=pp.reduce((sum,p)=>sum+p[2],0)/pp.length;
    const shimmer=reduced?.5:.5+.5*Math.sin(t*.0024+i*.48);
    const alpha=Math.max(.17,Math.min(.85,.34+z*.19+.20*shimmer));
    ctx.strokeStyle='rgba(255,64,92,'+alpha.toFixed(3)+')';
    ctx.lineWidth=.78+.38*shimmer;
    ctx.beginPath();
    pp.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.stroke();
    // Moving electric pulses cross the folds, leaving a short bright neon trail.
    if(!reduced&&i%5===0&&pp.length>12){
      const center=Math.floor(((t*.00042+i*.119)%1)*(pp.length-1));
      const first=Math.max(0,center-5),last=Math.min(pp.length-1,center+5);
      ctx.strokeStyle='rgba(255,208,217,.96)';
      ctx.lineWidth=2.5;
      ctx.shadowColor='#ff3154';ctx.shadowBlur=15;
      ctx.beginPath();ctx.moveTo(pp[first][0],pp[first][1]);
      for(let k=first+1;k<=last;k++)ctx.lineTo(pp[k][0],pp[k][1]);
      ctx.stroke();
      const head=pp[center];
      ctx.beginPath();ctx.arc(head[0],head[1],2.8,0,Math.PI*2);
      ctx.fillStyle='#fff5f7';ctx.fill();
      ctx.shadowBlur=0;
    }
  }
  nodes.forEach((node,i)=>{
    const p=nodePoint(i);
    if(state==='brain')drawNodePulse(p,i,renderTime);
    node.style.left=p[0]+'px';node.style.top=p[1]+'px';
    node.style.zIndex=String(Math.round((p[2]+2)*100));
    node.style.opacity=String(Math.max(.65,.89+p[2]*.1));
    const near=project(thinkingPoint([anchors[i][0]*.65,anchors[i][1]*.85,anchors[i][2]*.8],renderTime));
