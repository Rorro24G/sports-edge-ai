<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{color-scheme:dark;--red:#ff5365;--light:#ff8893;--black:#050506}*{box-sizing:border-box}html,body{margin:0;background:var(--black);color:#f6f3f4;font-family:Arial,Helvetica,sans-serif;overflow:hidden}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid white;outline-offset:8px}#stage{height:760px;min-height:560px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#22090e55,transparent 61%)}#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .65s,transform .9s;text-align:center;padding:24px;background:#050506;z-index:5}.eyebrow{font-size:10px;letter-spacing:.38em;color:#bd8289;font-weight:700}.brand{font-size:clamp(48px,8.7vw,108px);letter-spacing:-.07em;line-height:.91;color:var(--red);margin:29px 0 22px;font-weight:900;text-shadow:0 0 46px #ff445333}.brand span{display:block;font-size:.55em;letter-spacing:.29em;margin:18px 0 0 .29em;color:var(--light)}.sub{font-size:13px;color:#bdaeb1;line-height:1.8;letter-spacing:.06em;margin:5px 0 35px}#enter{position:relative;color:#160306;background:var(--red);border:1px solid #ff9aa4;border-radius:50%;width:94px;height:94px;font-size:24px;box-shadow:0 0 32px #ff536557;animation:pulse 2.8s ease-in-out infinite}#enter:before,#enter:after{content:'';position:absolute;inset:-10px;border-radius:50%;border:1px solid #ff536548}#enter:after{inset:-22px;border-color:#ff53651b}.enter-label{margin-top:34px;font-size:10px;letter-spacing:.35em;color:var(--light)}.corner{position:absolute;bottom:25px;font-size:9px;letter-spacing:.18em;color:#8c7378}.corner.left{left:28px}.corner.right{right:28px}.hidden{opacity:0!important;pointer-events:none!important}#intro.leaving{transform:scale(1.22);opacity:0;pointer-events:none}#brain-ui{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s}header{position:absolute;top:30px;left:30px;right:30px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:12px;font-weight:800;letter-spacing:.15em;color:var(--red)}.mode{font-size:9px;letter-spacing:.2em;color:#9c737b}#nodes{position:absolute;inset:0}.neuron{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;color:var(--red);width:128px;height:70px;padding:0;transform:translate(-50%,-50%);will-change:transform;transition:opacity .2s}.neuron .label{position:absolute;bottom:49px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.14em;white-space:nowrap;font-weight:800;text-shadow:0 2px 8px #000,0 0 12px #ff536540;background:#070506c9;padding:5px 8px;border-radius:3px}.neuron .dot{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#ff7b87;box-shadow:0 0 0 6px #ff536516,0 0 18px #ff5365,0 0 40px #ff536562}.neuron .dot:after{content:'';position:absolute;inset:-11px;border:1px solid #ff65766e;border-radius:50%}.neuron:hover .dot,.neuron:focus-visible .dot{background:#fff;box-shadow:0 0 30px #ff5365}.neuron:hover .label{color:#fff}.controls{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);pointer-events:auto;display:flex;gap:14px}.controls button{border:1px solid #633039;color:#ff8290;background:#10090c;border-radius:20px;font-size:10px;letter-spacing:.08em;padding:9px 16px}.hint{position:absolute;bottom:34px;width:100%;text-align:center;font-size:10px;color:#a8868d;letter-spacing:.14em}#flight-label{position:absolute;top:45%;width:100%;text-align:center;letter-spacing:.3em;color:var(--light);font-size:11px;opacity:0;pointer-events:none}#fallback{display:none;position:absolute;bottom:0}.reduced #enter{animation:none}@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 24px #ff536544}50%{transform:scale(1.06);box-shadow:0 0 48px #ff536588}}@media(max-width:600px){#stage{height:680px}.brand{font-size:62px}.corner{font-size:8px}.mode{display:none}.neuron{width:100px}.neuron .label{font-size:9px;letter-spacing:.07em;padding:4px}.hint{font-size:8px;letter-spacing:.06em}header{left:20px;top:20px}.sub{font-size:12px}}

/* Always-on neon: bright, animated, and clearly visible even without hovering. */
#stage{background:radial-gradient(ellipse at 50% 52%,#39071288 0%,#13040a 43%,#050506 83%)}
/* Let the moving brain be visible THROUGH the intro instead of hiding it behind opaque paint. */
#intro{background:radial-gradient(ellipse at 50% 50%,rgba(5,5,6,.24) 0%,rgba(5,5,6,.13) 48%,rgba(5,5,6,.58) 100%);isolation:isolate}
#intro:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 52%,transparent 25%,#08040888 91%);z-index:-1}
#intro .brand{filter:drop-shadow(0 0 28px #ff2b55c7)}
#stage .neuron .label{font-size:clamp(11px,1.1vw,14px);color:#ffe0e7;text-shadow:0 0 9px #fff,0 0 21px #ff2b55,0 0 43px #ff2b55}
#stage .neuron .dot{width:19px;height:19px;margin:-9.5px}
@keyframes neon-field-shift{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
#stage{background-image:radial-gradient(circle at 50% 50%,#82112e70 0%,transparent 47%),radial-gradient(circle at 75% 30%,#ff244d26,transparent 40%);background-size:125% 125%;animation:neon-field-shift 9s ease-in-out infinite}
#stage:after{content:"";position:absolute;inset:-30%;pointer-events:none;z-index:1;opacity:.27;background:conic-gradient(from 0deg at 50% 50%,transparent 4%,#ff285814 20%,transparent 36%,#ff366722 54%,transparent 69%);animation:neural-halo-spin 16s linear infinite}
#intro,#brain-ui{z-index:2}
#stage .neuron .dot{filter:drop-shadow(0 0 10px #ff365e)}

#motion-toggle:hover,#motion-toggle:focus-visible{background:#3c0c1b;color:#fff}
@keyframes neural-halo-spin{to{transform:rotate(360deg)}}
#stage .brand{color:#ff405d;text-shadow:0 0 5px #ffe4e8,0 0 16px #ff244d,0 0 38px #ff244ddd,0 0 88px #ff244d8c;animation:brand-breathe 3.6s ease-in-out infinite}
#stage .brand span{color:#ffb8c4;text-shadow:0 0 12px #fff3f5,0 0 36px #ff3b62,0 0 70px #ff30548a;animation:ai-glow 3.6s ease-in-out infinite}
#stage .logo{color:#ff4e6a;text-shadow:0 0 5px #ffecf0,0 0 16px #ff244d,0 0 40px #ff244da5;animation:letter-glow 2.7s ease-in-out infinite}
#stage .eyebrow,#stage .enter-label{color:#ffb3c1;text-shadow:0 0 13px #ff456ab8;animation:ambient-float 3.5s ease-in-out infinite}
#stage #enter{background:#ff3656;border-color:#ffb9c3;box-shadow:0 0 32px #ff3556cc,0 0 72px #ff244d70;animation:enter-heartbeat 1.8s ease-in-out infinite}
#stage #enter:before{animation:enter-ring 1.8s ease-out infinite}
#stage #enter:after{animation:enter-ring 1.8s ease-out -0.9s infinite}
#stage .neuron{animation:node-drift 2.7s ease-in-out infinite}
#stage .neuron:nth-child(2n){animation-delay:-.8s}
#stage .neuron:nth-child(3n){animation-delay:-1.5s}
#stage .neuron .dot{width:16px;height:16px;margin:-8px;background:#ff4966;animation:neuron-heartbeat 1.75s ease-in-out infinite}
#stage .neuron:nth-child(2n) .dot{animation-delay:-.58s}
#stage .neuron:nth-child(3n) .dot{animation-delay:-1.16s}
#stage .neuron .dot:before,#stage .neuron .dot:after{content:'';position:absolute;inset:-13px;border:1px solid #ff5579;border-radius:50%;pointer-events:none;animation:neuron-aura 1.75s ease-out infinite}
#stage .neuron .dot:before{animation-delay:-.88s;border-color:#ff9aaa}
#stage .neuron:nth-child(2n) .dot:after,#stage .neuron:nth-child(2n) .dot:before{animation-delay:-.58s}
#stage .neuron:nth-child(3n) .dot:after,#stage .neuron:nth-child(3n) .dot:before{animation-delay:-1.16s}
#stage .neuron .label{color:#ffc1cb;font-size:12px;text-shadow:0 0 7px #fff,0 0 14px #ff3059,0 0 28px #ff3059,0 0 42px #ff3059ab;animation:label-float 2.7s ease-in-out infinite}
#stage .neuron:nth-child(2n) .label{animation-delay:-.8s}
#stage .neuron:nth-child(3n) .label{animation-delay:-1.5s}

#stage .controls button:hover,#stage .controls button:focus-visible{transform:translateY(-2px);box-shadow:0 0 22px #ff5365a6;border-color:#ff9fac}
@keyframes brand-breathe{0%,100%{transform:translateY(0) scale(1);text-shadow:0 0 5px #ffe4e8,0 0 16px #ff244d,0 0 38px #ff244ddd,0 0 88px #ff244d8c}50%{transform:translateY(-5px) scale(1.026);text-shadow:0 0 9px #fff,0 0 24px #ff4967,0 0 58px #ff244d,0 0 110px #ff244dda}}
@keyframes ai-glow{0%,100%{opacity:.86}50%{opacity:1;text-shadow:0 0 14px #fff,0 0 40px #ff3b62,0 0 86px #ff3054}}
@keyframes letter-glow{0%,100%{opacity:.75}50%{opacity:1;text-shadow:0 0 12px #fff,0 0 24px #ff244d,0 0 48px #ff244d}}
@keyframes ambient-float{0%,100%{transform:translateY(0);opacity:.78}50%{transform:translateY(-5px);opacity:1}}
@keyframes enter-heartbeat{0%,100%{transform:scale(1);box-shadow:0 0 25px #ff244dbb,0 0 60px #ff244d55}42%{transform:scale(1.12);box-shadow:0 0 36px #ffb5c3,0 0 80px #ff244dcc}55%{transform:scale(1.04)}}
@keyframes enter-ring{0%{transform:scale(.8);opacity:.85}100%{transform:scale(1.55);opacity:0}}
@keyframes node-drift{0%,100%{transform:translate(-50%,-50%) translate(0,0)}50%{transform:translate(-50%,-50%) translate(3px,-7px)}}
@keyframes neuron-heartbeat{0%,100%{transform:scale(1);box-shadow:0 0 0 6px #ff53652a,0 0 25px #ff5365,0 0 52px #ff5365aa}42%{transform:scale(1.55);box-shadow:0 0 0 13px #ff536542,0 0 33px #ffefef,0 0 72px #ff3059}56%{transform:scale(1.15)}}
@keyframes neuron-aura{0%{transform:scale(.65);opacity:.9}75%{opacity:.6}100%{transform:scale(2.35);opacity:0}}
@keyframes label-float{0%,100%{transform:translateX(-50%) translateY(0);opacity:.89}50%{transform:translateX(-50%) translateY(-5px);opacity:1}}
@media(max-width:600px){#stage .neuron .label{font-size:10px}#stage .brand{font-size:clamp(46px,13vw,62px)}}
/* Movement is enabled by default as requested; the visible toggle can pause it. */
.reduced #stage .brand,.reduced #stage .brand span,.reduced #stage .logo,
.reduced #stage .eyebrow,.reduced #stage .enter-label,.reduced #stage #enter,
.reduced #stage #enter:before,.reduced #stage #enter:after,.reduced #stage .neuron,
.reduced #stage .neuron .dot,.reduced #stage .neuron .dot:before,
.reduced #stage .neuron .dot:after,.reduced #stage .neuron .label,
.reduced #stage:after,.reduced #stage{animation:none!important}
.reduced #stage .controls button{transition:none!important}

/* v5: labels stay attached; only the light core and aura beat. */
#stage .neuron,#stage .neuron .label{animation:none;transform:translate(-50%,-50%)}
#stage .neuron .label{transform:translateX(-50%);color:#ff91a2;text-shadow:0 0 6px #ff5365,0 0 18px #ff375b;background:#080409d9}
#stage .neuron .dot{width:18px;height:18px;margin:-9px;animation:connected-heartbeat 2.2s ease-in-out infinite}
#stage .neuron:nth-child(2n) .dot{animation-delay:-.72s}
#stage .neuron:nth-child(3n) .dot{animation-delay:-1.44s}
#stage .neuron .dot:before{animation:connected-wave 2.2s ease-out infinite}
#stage .neuron .dot:after{animation:connected-wave 2.2s ease-out -1.1s infinite}
@keyframes connected-heartbeat{0%,100%{transform:scale(.9);box-shadow:0 0 13px #ff5365,0 0 26px #ff536580}18%{transform:scale(1.36);box-shadow:0 0 23px #ffb2be,0 0 46px #ff375b}32%{transform:scale(.98)}44%{transform:scale(1.19);box-shadow:0 0 19px #ff8a9b,0 0 36px #ff375b}62%{transform:scale(.9)}}
@keyframes connected-wave{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.9);opacity:0}}
.reduced #stage .neuron .dot,.reduced #stage .neuron .dot:before,.reduced #stage .neuron .dot:after{animation:none!important}

/* Explicit depth and light-speed feedback when entering any of the six nodes. */
#stage.portal-diving::before{
  content:"";position:absolute;inset:-16%;z-index:7;pointer-events:none;
  background:
    repeating-radial-gradient(circle at center,transparent 0 24px,#ff7b9861 25px 26px,transparent 27px 51px),
    radial-gradient(circle at center,#ffd6e7ce 0%,#ff3f6a91 11%,#55122c83 27%,transparent 68%);
  filter:drop-shadow(0 0 30px #ff5578);
  opacity:0;animation:portal-depth-launch 1.1s cubic-bezier(.19,.67,.16,1) both;
}
#stage.portal-diving #flight-label{
  z-index:10;color:#fff;font-size:clamp(16px,3vw,31px);
  letter-spacing:.23em;font-weight:900;text-shadow:0 0 18px #fff,0 0 40px #ff486f;
  animation:portal-title-launch 1.1s ease-out both;
}
@keyframes portal-depth-launch{
  0%{opacity:0;transform:scale(.12) rotate(-9deg)}
  31%{opacity:.65;transform:scale(.58)}
  73%{opacity:.96;transform:scale(2.5) rotate(6deg)}
  100%{opacity:0;transform:scale(8);filter:blur(18px)}
}
@keyframes portal-title-launch{
  0%{opacity:0;transform:scale(.45) translateY(22px)}
  23%,56%{opacity:1}
  100%{opacity:0;transform:scale(3) translateY(-14px)}
}
.reduced #stage.portal-diving::before,
.reduced #stage.portal-diving #flight-label{animation:none!important}

/* Performance: avoid animated full-stage gradients, huge text glows,
   and paint-heavy box-shadow interpolation. Move/opacity remain animated. */
#stage{animation:none!important;background-size:100% 100%!important}
#stage::after{animation:none!important;opacity:.12!important}
#stage .brand{animation:fast-brand 4.6s ease-in-out infinite!important;
  text-shadow:0 0 12px #ff405d,0 0 30px #ff405d76!important}
#stage .brand span,#stage .logo,#stage .eyebrow,
#stage .enter-label,#stage .neuron .label{animation:none!important}
#stage #enter{animation:fast-heart 2.5s ease-in-out infinite!important;
  box-shadow:0 0 21px #ff536590!important}
#stage .neuron .dot{animation:fast-heart 2.6s ease-in-out infinite!important;
  box-shadow:0 0 13px #ff536590!important}
#stage .neuron .dot::before,#stage .neuron .dot::after{
  animation:connected-wave 2.6s ease-out infinite!important
}
#stage.portal-diving::before{
  filter:none!important;inset:15%!important;
  background:radial-gradient(circle at center,#ff5f8ad7 0%,#b0215577 22%,transparent 67%)!important
}
@keyframes fast-brand{0%,100%{transform:translate3d(0,0,0)}
  50%{transform:translate3d(0,-4px,0)}}
@keyframes fast-heart{0%,100%{transform:scale(.92);opacity:.9}
  50%{transform:scale(1.12);opacity:1}}
@media(max-width:720px){
  #stage{height:620px;min-height:500px}
  #stage .neuron .dot::before{display:none}
  #stage .brand{animation:none!important}
}
/* Crisp lettering and a clean, continuously beating entry core. */
#stage #intro .brand{font-size:clamp(38px,7.4vw,88px);letter-spacing:.015em;line-height:1.05;color:#ff637b;filter:none!important;text-shadow:0 0 9px #ff405d66!important;animation:none!important;margin:24px 0 18px}
#stage #intro .brand span{font-size:.48em;letter-spacing:.18em;margin:12px 0 0 .18em;color:#ffd5dd;filter:none;text-shadow:none!important}
#stage .sub{color:#f2dce1;font-size:14px;text-shadow:0 2px 8px #000;margin-bottom:32px}
#stage .enter-label{color:#ffd4dd;text-shadow:0 2px 6px #000;letter-spacing:.22em}
#stage #enter{border:0!important;outline-offset:8px;background:#ff4164;width:86px;height:86px;animation:clean-heartbeat 1.7s ease-in-out infinite!important;box-shadow:0 0 24px #ff416466!important}
#stage #enter::before,#stage #enter::after{display:none!important}
@keyframes clean-heartbeat{0%,60%,100%{transform:scale(.94)}18%{transform:scale(1.15)}32%{transform:scale(1)}43%{transform:scale(1.09)}}
.reduced #stage #enter,.reduced #stage .neuron .dot,.reduced #stage .neuron .dot::before,.reduced #stage .neuron .dot::after{animation:none!important}
</style></head>
<body><main id="stage">
<canvas id="scene" aria-label="Cerebro tridimensional volumétrico, con tejido iluminado y conexiones. Usa los seis botones para abrir una sección."></canvas>
<section id="intro"><div class="eyebrow">INTELIGENCIA DEPORTIVA</div><h1 class="brand">SPORTS EDGE<span>AI</span></h1><p class="sub">Cada decisión comienza con una conexión.</p><button id="enter" aria-label="Entrar al cerebro"></button><div class="enter-label">ENTRAR AL CEREBRO</div><span class="corner left">SEIS CONEXIONES. UN CEREBRO.</span><span class="corner right">SPORTS EDGE AI / 01</span></section>
<section id="brain-ui" aria-label="Navegación del cerebro" inert><header><span class="logo">SPORTS EDGE AI</span><span class="mode">EL CEREBRO / ELIGE UNA CONEXIÓN</span></header><div id="nodes">
<button class="neuron" data-page="picks"><span class="label">PICKS</span><span class="dot"></span></button>
<button class="neuron" data-page="parlays"><span class="label">PARLAYS</span><span class="dot"></span></button>
<button class="neuron" data-page="noticias"><span class="label">NOTICIAS</span><span class="dot"></span></button>
<button class="neuron" data-page="simulaciones"><span class="label">SIMULACIONES</span><span class="dot"></span></button>
<button class="neuron" data-page="historial"><span class="label">HISTORIAL</span><span class="dot"></span></button>
<button class="neuron" data-page="calendario"><span class="label">CALENDARIO</span><span class="dot"></span></button>
</div><div class="controls"><button id="rotate" aria-pressed="false">Pausar señales</button><button id="reset">Centrar cerebro</button></div><div class="hint">ARRASTRA PARA EXPLORAR · ELIGE UN PUNTO PARA ENTRAR</div></section><button id="motion-toggle" aria-pressed="true" aria-label="Activar o pausar las animaciones">MOVIMIENTO ON</button><div id="flight-label" role="status" aria-live="polite"></div>
</main>
<script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:true,desynchronized:true}),stage=document.getElementById('stage');
const intro=document.getElementById('intro'),ui=document.getElementById('brain-ui'),flight=document.getElementById('flight-label');
// Continuous motion is the product default; only an explicit pause stops it.
let reduced=false;
function syncMotion(){
  document.body.classList.toggle('reduced',reduced);
  const toggle=document.getElementById('motion-toggle');
  toggle.textContent=reduced?'ACTIVAR MOVIMIENTO':'MOVIMIENTO ON';
  toggle.setAttribute('aria-pressed',String(!reduced));
}
syncMotion();
document.getElementById('motion-toggle').onclick=()=>{
  reduced=!reduced;
  paused=reduced;
  syncMotion();updatePause();
};
const lowPower=matchMedia('(max-width:720px)').matches;
let rotCa=1,rotSa=0,rotCt=1,rotSt=0,floatY=0,floatX=0;
let W=1000,H=760,state='intro',angle=-.18,tilt=.12,paused=reduced,drag=false,lastX=0,lastY=0,start=0,zoom=1,breathing=1,flightBlend=0,flightX=0,flightY=0,target=null,ready=false,renderTime=0;
const nodes=[...document.querySelectorAll('.neuron')];
const anchors=[[-.64,-.65,.60],[.64,-.64,.60],[-.88,.05,.18],[.88,.06,.18],[-.50,.55,.48],[.50,.55,.48]];
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function size(){W=stage.clientWidth;H=stage.clientHeight;const d=lowPower?1:Math.min(devicePixelRatio||1,1.35);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);send('streamlit:setFrameHeight',{height:H})}addEventListener('resize',size);
function showBrain(){state='brain';intro.classList.add('hidden');intro.inert=true;ui.style.opacity=1;ui.inert=false;nodes[0].focus({preventScroll:true})}
document.getElementById('enter').onclick=()=>{intro.classList.add('leaving');intro.inert=true;if(reduced){showBrain();return}state='entry';start=performance.now();flight.textContent='';flight.style.opacity=0};
function openSection(button){
  if(state!=='brain')return;
  const index=nodes.indexOf(button),focus=nodePoint(index);
  flightX=focus[0]-W/2;flightY=focus[1]-H*.48;flightBlend=0;
  target=button.dataset.page;state='dive';start=performance.now();
  stage.classList.add('portal-diving');
  ui.style.opacity=0;ui.inert=true;
  flight.textContent=button.innerText;flight.style.opacity=1;
  if(reduced)finish();
}
function finish(){state='done';send('streamlit:setComponentValue',{value:{page:target,nonce:Date.now()},dataType:'json'});flight.textContent=target.toUpperCase();if(window.parent===window){setTimeout(()=>{zoom=1;flightBlend=0;showBrain();flight.style.opacity=0},900)}}
nodes.forEach(b=>{b.onclick=()=>openSection(b)});
function updatePause(){document.getElementById('rotate').textContent=paused?'Reanudar señales':'Pausar señales';document.getElementById('rotate').setAttribute('aria-pressed',String(paused))}updatePause();
document.getElementById('rotate').onclick=()=>{reduced=!reduced;paused=reduced;syncMotion();updatePause()};document.getElementById('reset').onclick=()=>{angle=-.18;tilt=.12};
canvas.onpointerdown=e=>{if(state!=='brain')return;drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;angle=Math.max(-.30,Math.min(.30,angle+(e.clientX-lastX)*.0012));tilt=Math.max(-.10,Math.min(.20,tilt+(e.clientY-lastY)*.001));lastX=e.clientX;lastY=e.clientY};canvas.onpointerup=canvas.onpointercancel=()=>drag=false;
